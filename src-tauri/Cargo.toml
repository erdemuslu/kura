[package]
name = "local-media-hub"
version = "0.1.0"
description = "Yerel medya (film, dizi, müzik) yönetim ve uzaktan kumanda merkezi"
edition = "2021"

[lib]
name = "local_media_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2.4"
lofty = "0.20"
uuid = { version = "1", features = ["v4"] }
# Albüm kapağı iTunes fallback'i için (key'siz, rustls — OpenSSL gerekmez)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Gömülü müzik player: /api/stream HTTP Range akışı için
tokio-util = { version = "0.7", features = ["io"] }
# Last.fm API isteklerini imzalamak (MD5 api_sig) için
md-5 = "0.10"

[profile.release]
strip = true
lto = true
